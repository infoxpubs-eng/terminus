name: CI

on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validation du dépôt (bundle, banques, news.json)
        run: node scripts/ci_prepare.js
      - name: Harnais de non-régression (scénarios A-J)
        run: node scripts/test.js ABCDEFGHIJ
